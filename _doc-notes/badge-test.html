<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>badge isolate</title>
<style>
body{margin:0;padding:24px;background:#141619;font-family:-apple-system,"PingFang SC",sans-serif}
.row{display:flex;flex-direction:column;gap:16px;margin-bottom:22px}
.lbl{color:#9a9aa0;font-size:12px;margin-bottom:6px}
.b{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;line-height:1;letter-spacing:.3px;white-space:nowrap;color:#e8e8ea;background:linear-gradient(120deg,rgba(88,184,72,.32),rgba(88,184,72,.12));border:1px solid rgba(88,184,72,.6);box-shadow:0 0 10px rgba(88,184,72,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.b::before{content:"";width:4px;height:4px;border-radius:50%;background:#58B848}
[data-plugin="dsh-root-brand"] .dsc{border-color:#f44336}
</style></head><body>
<div class="row"><div class="lbl">1) 普通 class（13px 基础样式）</div><span class="b">agentic system</span></div>
<div class="row"><div class="lbl">2) 后代选择器（b 样式应生效）</div><span data-plugin="dsh-root-brand"><span class="b">agentic system</span></span></div>
<div class="row"><div class="lbl">3) 去 backdrop-filter</div><span class="b" style="-webkit-backdrop-filter:none;backdrop-filter:none">agentic system</span></div>
<div class="row"><div class="lbl">4) 大字 24px 纯文本（无任何样式）</div><span style="color:#e8e8ea;font-size:24px">agentic system</span></div>
</body></html>
