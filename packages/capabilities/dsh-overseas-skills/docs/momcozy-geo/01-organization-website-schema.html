<!-- momcozy.com 主页 · 增强版 Organization + WebSite（可直接粘贴，字段均来自真实抓取） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Momcozy",
  "url": "https://www.momcozy.com",
  "description": "Momcozy makes high-quality breast pumps, nursing bras, baby carriers, and care essentials. Global No. 1 wearable breast pump brand, trusted by 6M+ moms and families.",
  "brand": { "@type": "Brand", "name": "Momcozy" }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Momcozy",
  "url": "https://www.momcozy.com",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://www.momcozy.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
