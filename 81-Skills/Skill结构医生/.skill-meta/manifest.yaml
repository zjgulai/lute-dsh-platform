name: root-skills-doctor
description: |
  检测 Skill 目录结构问题并执行自动修复，支持单 Skill 和批量模式。
  当用户提及"修复 skill 结构"、"skill 目录整理"、"批量修复 skills"时使用。
version: "1.1.0"
author:
  name: "LUTE Skills Team"
  email: ""
license: "MIT"
keywords:
  - skill-structure
  - directory-fix
  - batch-fix
  - skill-validation
  - auto-repair
categories:
  - lute
  - tooling
  - maintenance
complexity: complex
compatibility:
  claude:
    status: native
    features:
      - file_system
      - subprocess
  kimi:
    status: native
    features:
      - file_system
      - subprocess
  cursor:
    status: native
    features:
      - file_system
      - subprocess
  gpt:
    status: bridge
    limitations:
      - "File system operations need manual execution"
  minimax:
    status: bridge
    limitations:
      - "File system operations need manual execution"
triggers:
  keywords:
    - "修复 skill 结构"
    - "skill 目录整理"
    - "批量修复 skills"
    - "skill 结构检测"
    - "整理 skill 目录"
    - "修复目录结构"
    - "skill-doctor"
  phrases:
    - "检测 skill 目录问题"
    - "修复 skill 目录"
    - "批量整理 skills"
    - "skill 结构扫描"
  contexts:
    - "skill 目录"
    - "结构修复"
    - "批量处理"
    - "目录整理"
entry_points:
  - SKILL.md
  - scripts/skill-doctor.py
