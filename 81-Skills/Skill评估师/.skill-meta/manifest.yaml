skill:
  name: lute-skills-eval
  version: "2.1.0"
  structure_version: "1.0"
  created_at: "2026-04-02"
  updated_at: "2026-05-31"
  description: "基于 Universal Skill Schema 对 Skill 进行六维度深度评估，补充 routing quality、loading eval 和 boundary case 检查"
  
directories:
  scripts:
    exists: true
    count: 0
    description: "可执行脚本"
  references:
    exists: true
    count: 5
    files:
      - universal-skill-schema.md
      - evaluation-guide.md
      - scoring-criteria.md
      - batch-evaluation.md
      - loading-routing-evaluation.md
    description: "参考文档"
  examples:
    exists: true
    count: 2
    files:
      - sample-evaluation-report.md
      - sample-evaluation-report.yaml
    description: "示例报告"
  tests:
    exists: true
    count: 1
    files:
      - loading-routing-cases.md
    description: "测试用例"

dependencies:
  tools:
    - name: validate-skill.py
      path: scripts/validate-skill.py
      required: true
  skills: []

schema:
  version: "1.1.0"
  source: "universal-skill-schema"
  path: "references/universal-skill-schema.md"
  output:
    format: "yaml"
    interface_version: "2.0.0"
    required_keys:
      - skill_info
      - eval_info
      - scores
      - issues
      - optimization_plan
      - status
    breakdown_dimensions:
      - schema_compliance
      - frontmatter_quality
      - body_quality
      - methodology_audit
      - quality_gate
      - directory_structure
    routing_checks:
      - positive_loading
      - negative_loading
      - boundary_cases
      - accessory_file_read
  
compatibility:
  claude:
    status: "native"
    tested: true
  cursor:
    status: "native"
    tested: true
  kimi:
    status: "native"
    tested: true
    
workflow:
  input: skill-folder-path
  output:
    - "{skill-name}-evaluation-report.md"
    - "{skill-name}-evaluation-report.yaml"
  next_step: lute-skills-opt
